<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - CacauDelShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="header-content">
            <h1>CacauDelShow</h1>
            <p>Painel Administrativo</p>
        </div>
        <button id="btn-logout" class="btn-secondary">Sair</button>
    </header>

    <main class="dashboard-main">
        <section class="admin-grid">
            
            <!-- Card: Gerenciar / Cadastrar Usuários -->
            <div class="card admin-card">
                <h2>Cadastrar Novo Usuário</h2>
                <form id="create-user-form">
                    <label for="new-email">E-mail:</label>
                    <input type="email" id="new-email" required placeholder="vendedor@email.com">
                    
                    <label for="new-senha">Senha Temporária:</label>
                    <input type="password" id="new-senha" required placeholder="Mínimo de 6 caracteres">
                    
                    <label for="new-nome">Nome Completo:</label>
                    <input type="text" id="new-nome" required placeholder="Nome do Vendedor">

                    <label for="new-cargo">Cargo:</label>
                    <select id="new-cargo" class="select-input">
                        <option value="vendedor">Vendedor</option>
                        <option value="admin">Administrador</option>
                    </select>
                    
                    <button type="submit" class="btn-primary">Criar Usuário</button>
                </form>
            </div>

            <!-- Card: Atalhos / Estatísticas Rápidas -->
            <div class="card admin-card">
                <h2>Gerenciamento do Sistema</h2>
                <p>Aqui você poderá gerenciar o estoque, cadastrar produtos e acompanhar as vendas dos vendedores.</p>
                <div class="admin-actions">
                    <button class="btn-primary" onclick="alert('Módulo de Produtos em breve!')">Gerenciar Produtos e Estoque</button>
                    <button class="btn-secondary" onclick="alert('Relatórios em breve!')">Ver Relatórios de Vendas</button>
                </div>
            </div>

        </section>
    </main>

    <footer>
        <p>&copy; Desenvolvido por <strong>Fernando Pereira Nilsen</strong> e <strong>Gabriela Del Secchi</strong></p>
    </footer>

    <script type="module" src="admin.js"></script>
</body>
</html>

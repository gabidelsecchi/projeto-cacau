<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Administrador - Cacau Show</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Proteção de Rota Imediata -->
    <script>
        const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'));
        if (!usuarioLogado || usuarioLogado.tipo !== 'admin') {
            alert('Acesso negado! Faça login como Administrador.');
            window.location.href = 'index.html';
        }
    </script>

    <header>
        <h1>Painel de Gestão - Cacau Show</h1>
        <p>Área do Administrador</p>
    </header>

    <main>
        <section class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Painel do Administrador</h2>
                <button id="btn-logout" class="danger" style="width: auto; padding: 0.5rem 1rem;">Sair do Sistema</button>
            </div>
            
            <!-- Navbar / Abas do Admin -->
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="alternarAbaAdmin('usuarios')">Usuários</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('estoque')">Estoque</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('atribuir')">Montar Sacola</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('sacolas')">Sacolas Ativas</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('lucros')">Relatório de Lucros</button>
            </nav>

            <!-- Abas (Conteúdos iguais aos que você já tinha) -->
            <div id="tab-usuarios" class="admin-tab-content">
                <!-- Conteúdo de Usuários -->
            </div>
            <div id="tab-estoque" class="admin-tab-content hidden">
                <!-- Conteúdo de Estoque -->
            </div>
            <div id="tab-atribuir" class="admin-tab-content hidden">
                <!-- Conteúdo de Atribuir -->
            </div>
            <div id="tab-sacolas" class="admin-tab-content hidden">
                <!-- Conteúdo de Sacolas Ativas -->
            </div>
            <div id="tab-lucros" class="admin-tab-content hidden">
                <!-- Conteúdo de Lucros -->
            </div>
        </section>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>

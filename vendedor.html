<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Vendedor - CacauDelShow</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="header-content">
            <h1>CacauDelShow</h1>
            <p>Painel de Vendas e Estoque</p>
        </div>
        <div class="user-actions">
            <span id="user-greeting">Olá, Vendedor(a)</span>
            <button id="btn-logout" class="btn-secondary">Sair</button>
        </div>
    </header>

    <main class="dashboard-main vendor-main">
        <!-- Seção de Produtos / Estoque -->
        <section class="products-section">
            <h2>Produtos Disponíveis</h2>
            <div id="produtos-grid" class="produtos-grid">
                <!-- Os produtos cadastrados no Supabase vão aparecer aqui dinamicamente -->
                <p>Carregando produtos...</p>
            </div>
        </section>

        <!-- Seção da Sacola / Carrinho -->
        <section class="bag-section card">
            <h2>Sua Sacola de Vendas</h2>
            <div id="bag-items" class="bag-items">
                <p class="empty-bag">A sacola está vazia.</p>
            </div>
            <div class="bag-total">
                <strong>Total: R$ <span id="bag-total-value">0.00</span></strong>
            </div>
            <button id="btn-finalizar-venda" class="btn-primary" disabled>Finalizar Venda</button>
        </section>
    </main>

    <footer>
        <p>&copy; Desenvolvido por <strong>Fernando Pereira Nilsen</strong> e <strong>Gabriela Del Secchi</strong></p>
    </footer>

    <script type="module" src="vendedor.js"></script>
</body>
</html>

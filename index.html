<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão - Revenda Cacau Show</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CacauDelShow</h1>
        <p>Gestão de vendas</p>
    </header>

    <main>
        <!-- Seção de Login -->
        <section id="login-section" class="card">
            <h2>Acesso ao Sistema</h2>
            <form id="login-form">
                <label for="login-email">E-mail:</label>
                <input type="email" id="login-email" required placeholder="seu@email.com">
                
                <label for="login-senha">Senha:</label>
                <input type="password" id="login-senha" required placeholder="Sua senha">
                
                <button type="submit">Entrar</button>
            </form>
        </section>

        <!-- Painel do Administrador -->
        <section id="admin-panel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Painel do Administrador</h2>
                <button id="btn-logout" class="danger" style="width: auto; padding: 0.5rem 1rem;">Sair do Sistema</button>
            </div>
            
            <!-- Navbar / Abas do Admin -->
            <nav class="admin-nav">
                <button class="nav-btn active" onclick="alternarAbaAdmin('usuarios')">Gerenciar Usuários</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('estoque')">Estoque e Produtos</button>
                <button class="nav-btn" onclick="alternarAbaAdmin('sacolas')">Sacolas dos Vendedores</button>
            </nav>

            <!-- Aba 1: Gerenciamento de Usuários -->
            <div id="tab-usuarios" class="admin-tab-content">
                <div class="card">
                    <h3 id="user-form-title">Cadastrar Novo Usuário</h3>
                    <form id="user-form">
                        <input type="hidden" id="edit-user-id">
                        <input type="text" id="user-nome" placeholder="Nome do Usuário" required>
                        <input type="email" id="user-email" placeholder="E-mail" required>
                        <input type="password" id="user-senha" placeholder="Senha temporária" required>
                        <select id="user-tipo" required>
                            <option value="">Selecione o Perfil</option>
                            <option value="admin">Administrador</option>
                            <option value="vendedor">Vendedor</option>
                        </select>
                        <button type="submit" id="btn-salvar-user">Cadastrar Usuário</button>
                        <button type="button" id="btn-cancelar-user" class="danger hidden" onclick="cancelarEdicaoUsuario()">Cancelar Edição</button>
                    </form>
                    <div id="users-list"></div>
                </div>
            </div>

            <!-- Aba 2: Estoque e Produtos -->
            <div id="tab-estoque" class="admin-tab-content hidden">
                <div class="card">
                    <h3 id="product-form-title">Adicionar Produto ao Estoque</h3>
                    <form id="product-form">
                        <input type="hidden" id="edit-prod-id">
                        <input type="text" id="prod-nome" placeholder="Nome do Chocolate" required>
                        <input type="text" id="prod-categoria" placeholder="Categoria (ex: Trufas, Tabletes, Panetones)" required>
                        <input type="number" step="0.01" id="prod-custo" placeholder="Valor de Custo (R$)" required>
                        <input type="number" step="0.01" id="prod-venda" placeholder="Valor de Venda (R$)" required>
                        <input type="number" id="prod-qtd" placeholder="Quantidade em Estoque Geral" required>
                        <button type="submit" id="btn-salvar-prod">Salvar Produto</button>
                        <button type="button" id="btn-cancelar-prod" class="danger hidden" onclick="cancelarEdicaoProduto()">Cancelar Edição</button>
                    </form>
                    <div id="stock-list"></div>
                </div>
            </div>

            <!-- Aba 3: Sacolas dos Vendedores -->
            <div id="tab-sacolas" class="admin-tab-content hidden">
                <div class="card">
                    <h3>Atribuir / Gerenciar Sacolas dos Vendedores</h3>
                    <form id="sacola-form">
                        <select id="sacola-vendedor" required>
                            <option value="">Selecione o Vendedor</option>
                        </select>
                        <select id="sacola-produto" required>
                            <option value="">Selecione o Produto</option>
                        </select>
                        <input type="number" id="sacola-qtd" placeholder="Quantidade para a Sacola" required min="1">
                        <button type="submit">Enviar para Sacola do Vendedor</button>
                    </form>
                    <div id="admin-sacolas-status"></div>
                </div>
            </div>
        </section>

        <!-- Painel do Vendedor -->
        <section id="vendedor-panel" class="card hidden">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h2>Painel do Vendedor - Bem-vindo(a), <span id="vendedor-nome-display"></span></h2>
                <button id="btn-logout-vendedor" class="danger" style="width: auto; padding: 0.5rem 1rem;">Sair</button>
            </div>

            <div class="card">
                <h3>Sua Sacola Atual (Produtos Disponíveis)</h3>
                <div id="vendedor-sacola-itens">Carregando itens da sacola...</div>
            </div>
        </section>
    </main>

    <!-- SDK do Firebase (Modular v10+) -->
    <script type="module" src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Gestão Cacau Show</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>CacalDelShow</h1>
        <p>Gestão de vendas</p>
    </header>

    <main>
        <section id="login-section" class="card">
            <h2>Acesso ao Sistema</h2>
            <form id="login-form">
                <label for="login-email">E-mail:</label>
                <input type="email" id="login-email" required placeholder="seu@email.com">
                
                <label for="login-senha">Senha:</label>
                <input type="password" id="login-senha" required placeholder="Sua senha">
                
                <button type="submit">Entrar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; Desenvolvido por <strong>Fernando e Gabriela</strong>. Versão 1.0.0.</p>

    <script type="module" src="auth.js"></script>
</body>
</html>
